[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longshot"
version = "0.1.0"
description = "Find where prediction markets are wrong — systematically. Calibration and bias analytics for prediction markets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raul Tinajero Olivas" }]
keywords = ["prediction-markets", "calibration", "brier-score", "bias", "forecasting"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
longshot = "longshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
